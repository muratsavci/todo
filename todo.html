<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapılacaklar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f6f5e'/%3E%3Cpath d='M9 17l5 5 9-11' fill='none' stroke='white' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f3ee;
    --card: #ffffff;
    --ink: #23241f;
    --muted: #77776d;
    --line: #e4e1d8;
    --accent: #2f6f5e;
    --accent-ink: #ffffff;
    --danger: #b3412f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #212226;
      --ink: #ecebe6;
      --muted: #94948b;
      --line: #33343a;
      --accent: #5fb79e;
      --accent-ink: #10231e;
      --danger: #e8836f;
    }
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    padding: 48px 16px;
  }
  main { max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
  h1 { font-size: 28px; font-weight: 650; letter-spacing: -0.01em; margin: 0; }
  #count { color: var(--muted); font-size: 14px; white-space: nowrap; }

  #notice { margin: 0 0 12px; font-size: 14px; color: var(--danger); }
  #notice.info { color: var(--accent); }

  input[type="text"], input[type="email"], input[type="password"] {
    padding: 12px 14px;
    font: inherit; color: inherit;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  input::placeholder { color: var(--muted); }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
  li input[type="checkbox"]:focus { outline-offset: 2px; }

  .primary {
    padding: 0 18px;
    font: inherit; font-weight: 600;
    color: var(--accent-ink);
    background: var(--accent);
    border: 0; border-radius: 10px;
    cursor: pointer;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:disabled { opacity: 0.6; cursor: default; }

  .link {
    padding: 4px 8px;
    font: inherit;
    color: var(--muted);
    background: none;
    border: 0; border-radius: 6px;
    cursor: pointer;
  }
  .link:hover { color: var(--ink); }

  /* Giriş */
  #auth form { display: grid; gap: 10px; }
  #auth .primary { padding: 12px 18px; }
  #auth input { width: 100%; }
  #toggleMode { justify-self: center; font-size: 14px; }

  /* Görevler */
  #addForm { display: flex; gap: 8px; margin-bottom: 16px; }
  #new { flex: 1; min-width: 0; }

  .filters { display: flex; gap: 4px; margin-bottom: 12px; }
  .filters button {
    padding: 5px 12px;
    font: inherit; font-size: 14px;
    color: var(--muted);
    background: none;
    border: 0; border-radius: 8px;
    cursor: pointer;
  }
  .filters button:hover { color: var(--ink); }
  .filters button[aria-pressed="true"] { color: var(--ink); background: var(--line); font-weight: 600; }

  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 6px;
  }
  li.dragging { opacity: 0.45; }
  li input[type="checkbox"] {
    flex: none;
    width: 20px; height: 20px; margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .text { flex: 1; min-width: 0; overflow-wrap: anywhere; cursor: text; }
  li.done .text { color: var(--muted); text-decoration: line-through; }
  li input.edit {
    flex: 1; min-width: 0;
    padding: 2px 6px; margin: -3px -7px;
    background: var(--bg);
    border-radius: 6px;
  }
  .del {
    flex: none;
    width: 28px; height: 28px; padding: 0;
    font-size: 20px; line-height: 1;
    color: var(--muted);
    background: none;
    border: 0; border-radius: 6px;
    cursor: pointer;
    opacity: 0;
  }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--danger); }
  @media (hover: none) { .del { opacity: 1; } }

  #empty { color: var(--muted); text-align: center; padding: 32px 0; margin: 0; }

  footer { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; }
  .actions .link { margin-left: -8px; }
  .actions span { overflow-wrap: anywhere; }
  #clear:hover { color: var(--danger); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Yapılacaklar</h1>
    <span id="count"></span>
  </header>

  <p id="notice" role="status" hidden></p>

  <section id="auth" hidden>
    <form id="authForm">
      <input id="email" type="email" placeholder="E-posta" aria-label="E-posta" autocomplete="email" required>
      <input id="password" type="password" placeholder="Şifre" aria-label="Şifre" autocomplete="current-password" minlength="6" required>
      <button id="authSubmit" class="primary" type="submit">Giriş yap</button>
      <button id="toggleMode" class="link" type="button">Hesabın yok mu? Hesap oluştur</button>
    </form>
  </section>

  <section id="app" hidden>
    <form id="addForm" autocomplete="off">
      <input id="new" type="text" maxlength="2000" placeholder="Yeni görev ekle…" aria-label="Yeni görev">
      <button class="primary" type="submit">Ekle</button>
    </form>

    <div class="filters" role="group" aria-label="Filtre">
      <button type="button" data-filter="all">Tümü</button>
      <button type="button" data-filter="active">Aktif</button>
      <button type="button" data-filter="done">Bitenler</button>
    </div>

    <ul id="list"></ul>
    <p id="empty" hidden></p>

    <footer>
      <div>Düzenlemek için metne çift tıkla, sıralamak için sürükle.</div>
      <div class="actions">
        <button id="signOut" class="link" type="button">Çıkış yap</button>
        <button id="clear" class="link" type="button" hidden>Bitenleri sil</button>
      </div>
    </footer>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"
        integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK"
        crossorigin="anonymous"></script>
<script>
  // Bu anahtar herkese açık olacak şekilde tasarlanmıştır; verileri RLS kuralları korur.
  const SUPABASE_URL = 'https://qymeufxyobzihocujrzw.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_-hXR_SdP9TyGuFYQcx7iBw_wePeysdO';

  const OLD_KEY = 'todo.items.v1';        // Eski, yalnızca tarayıcıda tutulan liste
  const OLD_BACKUP_KEY = 'todo.items.v1.yedek';
  const FILTER_KEY = 'todo.filter.v1';

  const $ = (id) => document.getElementById(id);
  const list = $('list');
  const input = $('new');

  let sb = null;
  let userId = null;
  let items = [];
  let loading = false;
  let signingUp = false;
  let dragId = null;
  let filter = storageGet(FILTER_KEY) || 'all';
  if (!['all', 'active', 'done'].includes(filter)) filter = 'all';

  function storageGet(key) {
    try { return localStorage.getItem(key); } catch { return null; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, value); } catch {}
  }
  function storageRemove(key) {
    try { localStorage.removeItem(key); } catch {}
  }

  function notify(message, kind) {
    const el = $('notice');
    el.textContent = message || '';
    el.hidden = !message;
    el.classList.toggle('info', kind === 'info');
  }

  function explain(error) {
    const msg = (error && error.message) || '';
    if (/invalid login credentials/i.test(msg)) return 'E-posta veya şifre hatalı.';
    if (/email not confirmed/i.test(msg)) return 'E-posta adresin henüz doğrulanmadı. Gelen kutundaki bağlantıya tıkla.';
    if (/rate limit|too many/i.test(msg)) return 'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.';
    if (/password/i.test(msg)) return 'Şifre yeterince güçlü değil. Daha uzun bir şifre dene.';
    if (/failed to fetch|network/i.test(msg)) return 'Sunucuya ulaşılamadı. İnternet bağlantını kontrol et.';
    return 'Bir sorun oluştu: ' + msg;
  }

  /* ---------- Veri ---------- */

  async function load() {
    const { data, error } = await sb.from('tasks')
      .select('id, text, done, position')
      .order('position', { ascending: true })
      .order('created_at', { ascending: false });
    if (error) {
      notify(explain(error));
      return;
    }
    items = data;
    render();
  }

  // Değişiklik ekranda hemen görünür; sunucu reddederse liste yeniden yüklenir.
  async function commit(request) {
    const { error } = await request;
    if (error) {
      notify(explain(error) + ' Liste yeniden yüklendi.');
      await load();
      return false;
    }
    notify('');
    return true;
  }

  // Bu sayfanın eski sürümünde tarayıcıya kaydedilen görevleri bir kez hesaba taşır.
  async function migrateOldItems() {
    const raw = storageGet(OLD_KEY);
    if (!raw) return;

    let old;
    try { old = JSON.parse(raw); } catch { old = null; }
    const rows = (Array.isArray(old) ? old : [])
      .filter((x) => x && typeof x.text === 'string' && x.text.trim())
      .map((x, i) => ({ text: x.text.trim().slice(0, 2000), done: !!x.done, position: i }));

    // Aynı anda açık iki sekme aynı görevleri iki kez yüklemesin.
    storageSet(OLD_BACKUP_KEY, raw);
    storageRemove(OLD_KEY);
    if (!rows.length) return;

    const { error } = await sb.from('tasks').insert(rows);
    if (error) {
      storageSet(OLD_KEY, raw);
      notify('Eski görevlerin aktarılamadı, sonraki açılışta tekrar denenecek. ' + explain(error));
    } else {
      notify(rows.length + ' görev bu tarayıcıdan hesabına aktarıldı.', 'info');
    }
  }

  /* ---------- Ekran ---------- */

  function showAuth() {
    $('app').hidden = true;
    $('auth').hidden = false;
    $('count').textContent = '';
    $('authSubmit').textContent = signingUp ? 'Hesap oluştur' : 'Giriş yap';
    $('toggleMode').textContent = signingUp ? 'Hesabın var mı? Giriş yap' : 'Hesabın yok mu? Hesap oluştur';
    $('password').autocomplete = signingUp ? 'new-password' : 'current-password';
  }

  function visible(item) {
    if (filter === 'active') return !item.done;
    if (filter === 'done') return item.done;
    return true;
  }

  function buildRow(item) {
    const li = document.createElement('li');
    li.dataset.id = item.id;
    li.draggable = true;
    li.classList.toggle('done', item.done);

    const box = document.createElement('input');
    box.type = 'checkbox';
    box.checked = item.done;
    box.setAttribute('aria-label', item.text);
    box.addEventListener('change', () => {
      item.done = box.checked;
      render();
      commit(sb.from('tasks').update({ done: item.done }).eq('id', item.id));
    });

    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = item.text;
    text.addEventListener('dblclick', () => startEdit(li, item, text));

    const del = document.createElement('button');
    del.type = 'button';
    del.className = 'del';
    del.textContent = '×';
    del.title = 'Sil';
    del.setAttribute('aria-label', 'Sil: ' + item.text);
    del.addEventListener('click', () => {
      items = items.filter((x) => x.id !== item.id);
      render();
      commit(sb.from('tasks').delete().eq('id', item.id));
    });

    li.append(box, text, del);
    return li;
  }

  function startEdit(li, item, textEl) {
    li.draggable = false;
    const edit = document.createElement('input');
    edit.type = 'text';
    edit.className = 'edit';
    edit.maxLength = 2000;
    edit.value = item.text;
    edit.setAttribute('aria-label', 'Görevi düzenle');
    textEl.replaceWith(edit);
    edit.focus();
    edit.select();

    let finished = false;
    const finish = (save) => {
      if (finished) return;
      finished = true;
      const value = edit.value.trim();
      const changed = save && value && value !== item.text;
      if (changed) item.text = value;
      render();
      if (changed) commit(sb.from('tasks').update({ text: value }).eq('id', item.id));
    };

    edit.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    edit.addEventListener('blur', () => finish(true));
  }

  function render() {
    $('auth').hidden = true;
    $('app').hidden = false;

    const rows = items.filter(visible).map(buildRow);
    list.replaceChildren(...rows);

    const active = items.filter((x) => !x.done).length;
    const finished = items.length - active;

    $('count').textContent = items.length ? `${active} kaldı · ${finished} bitti` : '';
    $('clear').hidden = finished === 0;

    const empty = $('empty');
    empty.hidden = rows.length > 0;
    if (!rows.length) {
      empty.textContent =
        filter === 'done' ? 'Henüz biten görev yok.' :
        filter === 'active' && items.length ? 'Hepsi bitti.' :
        'Liste boş. Yukarıdan bir görev ekle.';
    }

    document.querySelectorAll('.filters button').forEach((b) => {
      b.setAttribute('aria-pressed', String(b.dataset.filter === filter));
    });
  }

  /* ---------- Giriş ---------- */

  async function enter(id) {
    userId = id;
    loading = true;
    $('count').textContent = '';
    await migrateOldItems();
    await load();
    loading = false;
    if (!$('notice').hidden && $('notice').classList.contains('info')) return;
    input.focus();
  }

  function leave() {
    userId = null;
    items = [];
    list.replaceChildren();
    showAuth();
  }

  $('authForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;
    const button = $('authSubmit');
    button.disabled = true;
    notify('');

    const { data, error } = signingUp
      ? await sb.auth.signUp({ email, password })
      : await sb.auth.signInWithPassword({ email, password });

    button.disabled = false;
    if (error) {
      notify(explain(error));
      return;
    }
    $('password').value = '';
    if (signingUp && !data.session) {
      signingUp = false;
      showAuth();
      notify('E-postana doğrulama bağlantısı gönderildi. Bağlantıya tıkla, sonra buraya dönüp giriş yap. ' +
             'Bağlantının açtığı sayfa hata gösterebilir, doğrulamayı etkilemez.', 'info');
    }
  });

  $('toggleMode').addEventListener('click', () => {
    signingUp = !signingUp;
    notify('');
    showAuth();
  });

  $('signOut').addEventListener('click', async () => {
    const { error } = await sb.auth.signOut();
    if (error) notify(explain(error));
  });

  /* ---------- Görev işlemleri ---------- */

  $('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    const first = items.length ? Math.min(...items.map((x) => x.position)) : 0;
    const item = { id: crypto.randomUUID(), text, done: false, position: first - 1 };
    items.unshift(item);
    input.value = '';
    if (filter === 'done') {
      filter = 'all';
      storageSet(FILTER_KEY, filter);
    }
    render();
    input.focus();
    commit(sb.from('tasks').insert(item));
  });

  document.querySelector('.filters').addEventListener('click', (e) => {
    const f = e.target.dataset.filter;
    if (!f) return;
    filter = f;
    storageSet(FILTER_KEY, filter);
    render();
  });

  $('clear').addEventListener('click', () => {
    items = items.filter((x) => !x.done);
    render();
    commit(sb.from('tasks').delete().eq('done', true));
  });

  /* ---------- Sürükle-bırak sıralama ---------- */

  list.addEventListener('dragstart', (e) => {
    const li = e.target.closest('li');
    if (!li) return;
    dragId = li.dataset.id;
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragId);
    requestAnimationFrame(() => li.classList.add('dragging'));
  });

  list.addEventListener('dragover', (e) => {
    if (!dragId) return;
    e.preventDefault();
    const dragged = list.querySelector(`li[data-id="${dragId}"]`);
    const over = e.target.closest('li');
    if (!dragged || !over || over === dragged) return;
    const box = over.getBoundingClientRect();
    const after = e.clientY > box.top + box.height / 2;
    list.insertBefore(dragged, after ? over.nextSibling : over);
  });

  list.addEventListener('dragend', () => {
    if (!dragId) return;
    const id = dragId;
    dragId = null;

    const li = list.querySelector(`li[data-id="${id}"]`);
    const item = items.find((x) => x.id === id);
    if (!li || !item) return render();

    // Yalnızca taşınan görevin yeri değişir; filtre yüzünden gizli olanlar yerinde kalır.
    const nextId = li.nextElementSibling && li.nextElementSibling.dataset.id;
    const prevId = li.previousElementSibling && li.previousElementSibling.dataset.id;
    const rest = items.filter((x) => x.id !== id);
    let index = nextId
      ? rest.findIndex((x) => x.id === nextId)
      : rest.findIndex((x) => x.id === prevId) + 1;
    if (index < 0) index = rest.length;
    rest.splice(index, 0, item);

    const unchanged = rest.every((x, i) => x === items[i]);
    items = rest;
    if (unchanged) return render();

    const before = rest[index - 1];
    const after = rest[index + 1];
    item.position =
      before && after ? (before.position + after.position) / 2 :
      before ? before.position + 1 :
      after ? after.position - 1 : 0;

    render();
    commit(sb.from('tasks').update({ position: item.position }).eq('id', item.id));
  });

  /* ---------- Başlangıç ---------- */

  // Başka cihazda yapılan değişiklikler sekmeye dönünce görünsün.
  window.addEventListener('focus', () => {
    if (userId && !loading && !dragId && !document.querySelector('.edit')) load();
  });

  if (!window.supabase) {
    notify('Bağlantı kurulamadı. İnternetini kontrol edip sayfayı yenile.');
  } else {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
    });

    sb.auth.onAuthStateChange((event, session) => {
      const id = session ? session.user.id : null;
      if (id === userId && event !== 'INITIAL_SESSION') return;
      // Kitaplık bu geri çağrının içinden yeni istek atılmasını istemez.
      setTimeout(() => {
        if (id && id !== userId) enter(id);
        else if (!id) leave();
      }, 0);
    });
  }
</script>
</body>
</html>
